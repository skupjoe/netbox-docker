version: '3.4'

services:
  netbox: &netbox
    image: docker.io/netboxcommunity/netbox:${NETBOX_VERSION:-v3.5}
    container_name: netbox
    hostname: netbox
    restart: always
    depends_on:
      - postgres
      - redis
      - redis-cache
      # - netbox-worker
    env_file: env/netbox.env
    user: 'unit:root'
    healthcheck:
      start_period: 60s
      timeout: 3s
      interval: 15s
      test: "curl -f http://localhost:8080/api/ || exit 1"
    volumes:
      # - ./startup_scripts:/opt/netbox/startup_scripts
      # - ./initializers:/opt/netbox/initializers
      - ./configuration:/etc/netbox/config
      - ./reports:/etc/netbox/reports
      - ./scripts:/etc/netbox/scripts
      - ./media:/opt/netbox/netbox/media
    # environment:
      # - NETBOX_DELETE_LEGACY_DATA=true
      # - RELEASE_CHECK_URL=http://0.0.0.0/
    logging: &logging
      options:
        max-size: 5m
        max-file: '3'

  netbox-worker:
    <<: *netbox
    container_name: netbox-worker
    hostname: netbox-worker
    restart: always
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      start_period: 20s
      timeout: 3s
      interval: 15s
      test: "ps -aux | grep -v grep | grep -q rqworker || exit 1"
    logging:
      <<: *logging

  netbox-housekeeping:
    <<: *netbox
    container_name: netbox-housekeeping
    hostname: netbox-housekeeping
    restart: always
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/housekeeping.sh
    healthcheck:
      start_period: 20s
      timeout: 3s
      interval: 15s
      test: "ps -aux | grep -v grep | grep -q housekeeping || exit 1"
    logging:
      <<: *logging

  postgres:
    image: docker.io/postgres:15-alpine
    container_name: netbox-postgres
    hostname: netbox-postgres
    restart: always
    ports:
      - 5444:5432
    env_file: env/postgres.env
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    logging:
      <<: *logging

  redis:
    image: docker.io/redis:7-alpine
    container_name: redis
    hostname: redis
    restart: always
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --appendonly yes --requirepass $$REDIS_PASSWORD
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
    logging:
      <<: *logging

  redis-cache:
    image: docker.io/redis:7-alpine
    container_name: redis-cache
    hostname: redis-cache
    restart: always
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --requirepass $$REDIS_PASSWORD
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data
    logging:
      <<: *logging

volumes:
  netbox-postgres-data:
    driver: local
  netbox-redis-cache-data:
    driver: local
  netbox-redis-data:
    driver: local
