services:
  netbox: &netbox
    image: docker.io/netboxcommunity/netbox:${NETBOX_VERSION:-v4.2}
    container_name: netbox
    hostname: netbox
    restart: always
    depends_on:
      - postgres
      - redis
      - redis-cache
    env_file: env/netbox.env
    user: "unit:root"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s
    volumes:
      - ./configuration:/etc/netbox/config
      - ./reports:/etc/netbox/reports
      - ./scripts:/etc/netbox/scripts
      - ./media:/opt/netbox/netbox/media
    logging: &logging
      options:
        max-size: 5m
        max-file: '3'

  netbox-worker:
    <<: *netbox
    container_name: netbox-worker
    hostname: netbox-worker
    restart: always
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    logging:
      <<: *logging

  netbox-housekeeping:
    <<: *netbox
    container_name: netbox-housekeeping
    hostname: netbox-housekeeping
    restart: always
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/housekeeping.sh
    healthcheck:
      test: ps -aux | grep -v grep | grep -q housekeeping || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    logging:
      <<: *logging

  postgres:
    image: docker.io/postgres:16-alpine
    container_name: netbox-postgres
    hostname: netbox-postgres
    restart: always
    ports:
      - 5444:5432
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    env_file: env/postgres.env
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    logging:
      <<: *logging

  redis:
    image: docker.io/valkey/valkey:8.0-alpine
    container_name: redis
    hostname: redis
    restart: always
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
    logging:
      <<: *logging

  redis-cache:
    image: docker.io/valkey/valkey:8.0-alpine
    container_name: redis-cache
    hostname: redis-cache
    restart: always
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: *redis-healthcheck
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data
    logging:
      <<: *logging

volumes:
  netbox-postgres-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-redis-cache-data:
    driver: local
